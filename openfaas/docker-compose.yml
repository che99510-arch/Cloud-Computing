services:

  gateway:
    image: openfaas/gateway:0.21.4
    ports:
      - "8080:8080"
    environment:
      - functions_provider_url=http://faas-netes:8081/
      - read_timeout=60s
      - write_timeout=60s
      - upstream_timeout=65s
      - basic_auth=true
      - secret_mount_path=/run/secrets/
    secrets:
      - basic-auth-user
      - basic-auth-password
    depends_on:
      - faas-netes
    networks:
      - openfaas

  faas-netes:
    image: openfaas/faas-netes:0.14.2
    environment:
      - read_timeout=60s
      - write_timeout=60s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - openfaas
      - openfaas-fn

networks:
  openfaas:
    driver: bridge
  openfaas-fn:
    driver: bridge

secrets:
  basic-auth-user:
    file: ./secrets/basic-auth-user
  basic-auth-password:
    file: ./secrets/basic-auth-password
